# 1 canary Pod. With 9 stable Pods, the canary track gets about 1 of 10 requests (10%).
# To send more traffic to the canary, increase the canary replicas and decrease the stable replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-canary
  namespace: s10-canary
  labels:
    app: myapp-canary
    track: canary
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp-canary
      track: canary
  template:
    metadata:
      labels:
        app: myapp-canary
        track: canary
        version: v2
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          # The postStart hook writes the track, the version and the Pod name into the web page.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    echo "Canary Demo | TRACK: canary | VERSION: v2 | Pod: $(hostname)" > /usr/share/nginx/html/index.html
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "80m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
