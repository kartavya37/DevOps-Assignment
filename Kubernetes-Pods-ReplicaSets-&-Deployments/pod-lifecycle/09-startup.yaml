# Startup probe: the app needs 30 seconds to start. The probe gives it up to 50 seconds (10 x 5s) before the kubelet stops it.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-startup
  namespace: s10-lifecycle
spec:
  containers:
    - name: slow-app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Application starting...'; sleep 30; touch /tmp/started; echo 'Application started'; sleep 300"]
      startupProbe:
        exec:
          command: ["sh", "-c", "test -f /tmp/started"]
        periodSeconds: 5
        failureThreshold: 10
