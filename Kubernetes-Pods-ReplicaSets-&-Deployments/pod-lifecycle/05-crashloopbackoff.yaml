# CrashLoopBackOff: the container exits with code 1 again and again. The kubelet restarts it with an increasing delay.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-crashloop
  namespace: s10-lifecycle
spec:
  containers:
    - name: crashing-app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Application started'; sleep 3; echo 'Application crashed'; exit 1"]
