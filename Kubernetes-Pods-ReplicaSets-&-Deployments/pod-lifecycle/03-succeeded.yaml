# Succeeded: the container does a short task and exits with code 0. restartPolicy: Never stops a restart.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-succeeded
  namespace: s10-lifecycle
spec:
  restartPolicy: Never
  containers:
    - name: task
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Task started'; sleep 5; echo 'Task completed successfully'; exit 0"]
