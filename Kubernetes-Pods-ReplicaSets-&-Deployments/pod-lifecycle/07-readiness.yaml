# Readiness probe: the Pod is Running before it is Ready. The probe decides when the Pod can receive traffic.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-readiness
  namespace: s10-lifecycle
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
