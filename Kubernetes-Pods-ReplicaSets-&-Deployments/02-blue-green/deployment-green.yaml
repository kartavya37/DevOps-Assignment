# The green environment runs version v2.
# Both environments run at the same time. The Service selector decides which one gets traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
  namespace: s10-bluegreen
  labels:
    app: myapp
    slot: green
    version: v2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
      slot: green
  template:
    metadata:
      labels:
        app: myapp
        slot: green
        version: v2
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          # The postStart hook writes the slot, the version and the Pod name into the web page.
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    echo "<html><body style='background:#15803d;color:#fff;font-family:monospace;font-size:2em;text-align:center;padding-top:15vh'><p>SLOT: green | VERSION: v2</p><p style='font-size:0.6em'>Pod: $(hostname)</p></body></html>" > /usr/share/nginx/html/index.html
          resources:
            requests:
              cpu: "30m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
