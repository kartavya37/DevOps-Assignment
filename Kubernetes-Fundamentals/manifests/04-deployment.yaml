# A Deployment manages ReplicaSets.
# It adds rolling updates and rollback to the ReplicaSet features.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deploy
  namespace: s9-basics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-deploy
  template:
    metadata:
      labels:
        app: web-deploy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
