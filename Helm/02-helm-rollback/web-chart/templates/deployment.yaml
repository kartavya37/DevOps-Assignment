apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web-chart.fullname" . }}
  labels:
    {{- include "web-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "web-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "web-chart.selectorLabels" . | nindent 8 }}
        app-version: {{ .Values.app.version | quote }}
      annotations:
        # If the ConfigMap changes, this checksum changes.
        # Then Kubernetes starts new Pods that read the new page.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: {{ include "web-chart.fullname" . }}-html
