apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app: {{ .Release.Name }}
data:
  # Environment variables for the container (envFrom).
  APP_NAME: {{ .Values.app.name | quote }}
  ENVIRONMENT: {{ .Values.app.environment | quote }}
  # The web page. nginx serves it from /usr/share/nginx/html.
  index.html: |
    <!doctype html>
    <html>
    <head><meta charset="utf-8"><title>{{ .Values.app.name }} ({{ .Values.app.environment }})</title></head>
    <body style="font-family: sans-serif; margin: 40px;">
      <h1>{{ .Values.app.name }}</h1>
      <p>Environment: <b>{{ .Values.app.environment }}</b> | replicas: {{ .Values.replicaCount }}</p>
      <h2>Notes</h2>
      <ul>
      {{- range .Values.app.notes }}
        <li>{{ . }}</li>
      {{- end }}
      </ul>
    </body>
    </html>
