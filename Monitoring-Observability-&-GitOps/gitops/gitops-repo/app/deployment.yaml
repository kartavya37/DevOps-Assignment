# Desired state of the application. Argo CD applies this file from Git.
# Do not change the live Deployment with kubectl. Change this file and push a commit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s20-gitops-app
  namespace: s20-gitops
  labels:
    app: s20-gitops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s20-gitops-app
  template:
    metadata:
      labels:
        app: s20-gitops-app
    spec:
      containers:
        - name: app
          image: ghcr.io/stefanprodan/podinfo:6.14.1
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
