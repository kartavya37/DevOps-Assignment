# Liveness probe demo. "--unhealthy" makes /healthz always return HTTP 503.
# The kubelet sees the failed liveness probe and restarts the container again and again.
apiVersion: v1
kind: Pod
metadata:
  name: liveness-demo
  namespace: s20-monitoring
  labels:
    app: liveness-demo
spec:
  containers:
    - name: podinfo
      image: ghcr.io/stefanprodan/podinfo:6.15.0
      command: ["./podinfo", "--port=9898", "--unhealthy"]
      livenessProbe:
        httpGet:
          path: /healthz
          port: 9898
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 2
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 50m, memory: 64Mi}
