# The ServiceMonitor tells the Prometheus Operator which Services to scrape.
# It selects both podinfo Services by the label "part-of: s20-demo".
# The "release" label is not necessary with our Helm values, but it is good practice.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: s20-demo
  namespace: s20-monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      part-of: s20-demo
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
