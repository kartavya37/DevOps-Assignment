# Load generator (fortio). It sends normal requests and some requests that return HTTP 500.
# Apply it to make the CPU and error-rate alerts fire. Delete it to make the alerts resolve.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: s20-monitoring
  labels:
    app: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        # Normal traffic: POST /echo goes from the frontend to the backend (this also makes traces).
        - name: normal
          image: fortio/fortio:1.75.3
          args: ["load", "-quiet", "-t", "0", "-qps", "300", "-c", "4", "-payload", "hello", "http://podinfo:9898/echo"]
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {cpu: 300m, memory: 64Mi}
        # Error traffic: /status/500 always returns HTTP 500.
        - name: errors
          image: fortio/fortio:1.75.3
          args: ["load", "-quiet", "-t", "0", "-qps", "20", "-c", "1", "-allow-initial-errors", "http://podinfo:9898/status/500"]
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 32Mi}
