apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: s20-monitoring
  labels:
    app: podinfo
    part-of: s20-demo
spec:
  selector:
    app: podinfo
  ports:
    - name: http
      port: 9898
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo-backend
  namespace: s20-monitoring
  labels:
    app: podinfo-backend
    part-of: s20-demo
spec:
  selector:
    app: podinfo-backend
  ports:
    - name: http
      port: 9898
      targetPort: http
