{{- if .Values.postgres.enabled }}
{{- $sel := dict "ctx" . "component" "postgres" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.postgresHost" . }}
  labels:
    {{- include "taskboard.labels" $sel | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "taskboard.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "taskboard.postgresHost" . }}
  labels:
    {{- include "taskboard.labels" $sel | nindent 4 }}
spec:
  serviceName: {{ include "taskboard.postgresHost" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "taskboard.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "taskboard.selectorLabels" $sel | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "taskboard.secretName" . }}
                  key: {{ .Values.database.secretKeys.username }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "taskboard.secretName" . }}
                  key: {{ .Values.database.secretKeys.password }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          {{- $probe := "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\"" }}
          startupProbe:
            exec: {command: ["sh", "-c", {{ $probe | quote }}]}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec: {command: ["sh", "-c", {{ $probe | quote }}]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["sh", "-c", {{ $probe | quote }}]}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The root file system is read-only. PostgreSQL writes only to the data volume,
          # the socket directory and /tmp.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}
