{{- if not .Values.database.existingSecret }}
# DEMO VALUES ONLY. See the CAUTION in values.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskboard.secretName" . }}
  labels:
    {{- include "taskboard.labels" (dict "ctx" . "component" "database") | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.database.username | quote }}
  DB_PASSWORD: {{ .Values.database.password | quote }}
{{- end }}
