# Default values for the TaskBoard chart.
# values-dev.yaml and values-prod.yaml override some of these values.

nameOverride: ""
fullnameOverride: ""

# Application settings (ConfigMap).
config:
  appEnv: default
  logLevel: info

# Database credentials (Secret). DEMO VALUES ONLY.
# CAUTION: Do not put real passwords in values files. Use "existingSecret" with a Secret
# that a secret manager creates, or give the password with --set at install time.
database:
  name: taskboard
  port: 5432
  username: taskboard
  password: demo-password-123
  # Use a Secret that already exists (the chart does not create one then).
  existingSecret: ""
  # The keys in the Secret that hold the user name and the password.
  secretKeys:
    username: DB_USER
    password: DB_PASSWORD

backend:
  image:
    repository: ghcr.io/kartavya37/taskboard-backend
    tag: ""            # empty = .Chart.AppVersion
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8000
  probes:
    livenessPath: /health
    readinessPath: /ready
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

frontend:
  image:
    repository: ghcr.io/kartavya37/taskboard-frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  port: 8080
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}

postgres:
  enabled: true
  image: postgres:16-alpine
  storage:
    size: 1Gi
    storageClassName: standard
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}

imagePullSecrets: []

ingress:
  enabled: true
  className: nginx
  host: taskboard.s21.local
  annotations: {}

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
  scaleDownStabilizationSeconds: 60

serviceMonitor:
  enabled: true
  interval: 15s
  labels:
    release: kube-prometheus-stack
