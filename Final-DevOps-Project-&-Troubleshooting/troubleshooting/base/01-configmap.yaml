# Settings that are not secret. The backend and the frontend read them as environment variables.
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskboard-config
  namespace: s21-troubleshoot
  labels:
    app.kubernetes.io/part-of: taskboard
data:
  APP_ENV: "troubleshoot"
  LOG_LEVEL: "info"
  DB_HOST: "taskboard-postgres"
  DB_PORT: "5432"
  DB_NAME: "taskboard"
  # The frontend Nginx sends /api/ requests to this address (used with kubectl port-forward).
  BACKEND_URL: "http://taskboard-backend:8000"
