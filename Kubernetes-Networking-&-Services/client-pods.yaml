# Client Pods for connectivity and DNS tests.
# curl-client: curl and busybox nslookup.
# dnsutils: the Kubernetes DNS debug image with dig and nslookup.
apiVersion: v1
kind: Pod
metadata:
  name: curl-client
  namespace: s11-services
  labels:
    app: curl-client
spec:
  containers:
    - name: client
      image: curlimages/curl:8.10.1
      command: ["sh", "-c", "sleep 36000"]
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: dnsutils
  namespace: s11-services
  labels:
    app: dnsutils
spec:
  containers:
    - name: dnsutils
      image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.3
      command: ["sleep", "36000"]
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
