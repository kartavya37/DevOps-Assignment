# A small app and a ClusterIP Service in a second namespace (s11-backend).
# Pods in s11-services use it to test cross-namespace DNS names.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: s11-backend
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          command: ["/bin/sh", "-c"]
          args:
            - echo "api response from $(hostname) in namespace s11-backend" > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: s11-backend
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 80
