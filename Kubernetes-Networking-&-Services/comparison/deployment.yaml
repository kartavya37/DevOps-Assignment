# A Deployment. The Deployment controller creates a ReplicaSet.
# The ReplicaSet creates the Pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-deploy
  namespace: s11-compare
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-deploy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: demo-deploy
    spec:
      containers:
        - name: web
          image: nginx:1.26-alpine
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
