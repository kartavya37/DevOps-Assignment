# A DaemonSet runs one Pod on each node.
# Typical use: log agents, monitoring agents, CNI plugins.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: demo-agent
  namespace: s11-compare
spec:
  selector:
    matchLabels:
      app: demo-agent
  template:
    metadata:
      labels:
        app: demo-agent
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"agent on node $NODE_NAME\"; sleep 60; done"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "5m"
              memory: "8Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
