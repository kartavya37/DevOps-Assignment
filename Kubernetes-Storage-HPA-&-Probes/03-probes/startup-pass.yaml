# FIXED: the startup probe allows 20 x 2 = 40 seconds for the slow start.
# The liveness probe starts only after the startup probe succeeds.
apiVersion: v1
kind: Pod
metadata:
  name: startup-demo
  namespace: s13-probes
spec:
  containers:
    - name: slow-app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Slow start: wait 20 seconds before the HTTP server starts"
          sleep 20
          mkdir -p /www && echo "slow app is up" > /www/index.html
          echo "HTTP server starts on port 8080"
          httpd -f -p 8080 -h /www
      startupProbe:
        httpGet:
          path: /
          port: 8080
        periodSeconds: 2
        failureThreshold: 20
      livenessProbe:
        httpGet:
          path: /
          port: 8080
        periodSeconds: 5
      readinessProbe:
        httpGet:
          path: /
          port: 8080
        periodSeconds: 5
