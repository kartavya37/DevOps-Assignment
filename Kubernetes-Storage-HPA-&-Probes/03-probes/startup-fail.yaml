# BROKEN: the application needs about 20 seconds to start.
# The startup probe allows only 3 x 2 = 6 seconds, so the kubelet restarts the container
# before the application is ready. The container never starts correctly.
apiVersion: v1
kind: Pod
metadata:
  name: startup-demo
  namespace: s13-probes
spec:
  containers:
    - name: slow-app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Slow start: wait 20 seconds before the HTTP server starts"
          sleep 20
          mkdir -p /www && echo "slow app is up" > /www/index.html
          echo "HTTP server starts on port 8080"
          httpd -f -p 8080 -h /www
      startupProbe:
        httpGet:
          path: /
          port: 8080
        periodSeconds: 2
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /
          port: 8080
        periodSeconds: 5
