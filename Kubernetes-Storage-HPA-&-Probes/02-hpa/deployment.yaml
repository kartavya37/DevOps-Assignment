# The HPA computes CPU utilization as (CPU usage / CPU request).
# Without resources.requests.cpu, the HPA shows <unknown> and does not scale.
# The small request (50m) lets a small load generator push the utilization above 50%.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-demo
  namespace: s13-hpa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-demo
  template:
    metadata:
      labels:
        app: hpa-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
