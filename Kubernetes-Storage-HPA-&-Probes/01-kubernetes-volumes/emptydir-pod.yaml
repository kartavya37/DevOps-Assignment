# Two containers share one emptyDir volume.
# The writer container adds a line every 5 seconds.
# The nginx container serves the same file over HTTP.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  namespace: s13-volumes
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do
            echo "$(date -u +%H:%M:%S) written by the writer container" >> /shared/index.html
            sleep 5
          done
      volumeMounts:
        - name: shared-data
          mountPath: /shared
    - name: web
      image: nginx:1.27
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
  volumes:
    - name: shared-data
      emptyDir: {}
