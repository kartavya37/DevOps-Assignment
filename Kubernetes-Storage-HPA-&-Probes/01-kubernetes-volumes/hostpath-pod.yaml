# hostPath mounts a directory from the node file system into the Pod.
# The data stays on the node after the Pod is deleted.
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
  namespace: s13-volumes
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: host-storage
          mountPath: /data
  volumes:
    - name: host-storage
      hostPath:
        path: /tmp/s13-hostpath-demo
        type: DirectoryOrCreate
