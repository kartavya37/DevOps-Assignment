# A Deployment with one replica that mounts the dynamic PVC.
# If you delete the Pod, the new Pod mounts the same volume and the data stays.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-pvc-demo
  namespace: s13-volumes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamic-pvc-demo
  template:
    metadata:
      labels:
        app: dynamic-pvc-demo
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dynamic-pvc
