# BROKEN: the application needs DATABASE_URL. The variable is not set,
# so the process exits with code 1 and Kubernetes restarts it again and again.
apiVersion: v1
kind: Pod
metadata:
  name: crash-demo
  namespace: s14-issues
spec:
  terminationGracePeriodSeconds: 2
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Application starting..."
          if [ -z "$DATABASE_URL" ]; then
            echo "FATAL: DATABASE_URL environment variable is missing" >&2
            exit 1
          fi
          echo "Connected to $DATABASE_URL"
          while true; do echo "Application is healthy"; sleep 10; done
