# Backend for the Service labs. Pod label: app=api. Container port: 80.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: s14-issues
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
