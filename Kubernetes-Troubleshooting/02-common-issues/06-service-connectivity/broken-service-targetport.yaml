# BROKEN (case B): the selector is correct, but targetPort is 8080.
# nginx listens on port 80, so every connection to the endpoints is refused.
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: s14-issues
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
