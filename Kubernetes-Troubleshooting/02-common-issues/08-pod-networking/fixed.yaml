# FIXED: the HTTP server listens on 0.0.0.0 (all interfaces) on port 8080.
# Other Pods and the Service can now reach it through the Pod IP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: s14-issues
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /www && echo "inventory service OK" > /www/index.html
              echo "httpd listens on 0.0.0.0:8080"
              httpd -f -v -p 0.0.0.0:8080 -h /www
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-svc
  namespace: s14-issues
spec:
  selector:
    app: inventory
  ports:
    - port: 80
      targetPort: 8080
