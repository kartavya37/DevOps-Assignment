# BROKEN: the Pod requests 20 CPU cores. The only node has 15 allocatable cores,
# so the scheduler cannot place the Pod and it stays Pending.
apiVersion: v1
kind: Pod
metadata:
  name: pending-demo
  namespace: s14-issues
spec:
  containers:
    - name: web
      image: nginx:1.27
      resources:
        requests:
          cpu: "20"
