# A container that prints a few lines and then exits with code 1.
# Kubernetes restarts it. Use "kubectl logs --previous" to read the logs of the last run.
apiVersion: v1
kind: Pod
metadata:
  name: restart-demo
  namespace: s14-commands
spec:
  terminationGracePeriodSeconds: 2
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Run started at $(date -u +%H:%M:%S)"
          echo "Loading configuration..."
          sleep 10
          echo "ERROR: cannot open /config/app.conf, exit code 1"
          exit 1
