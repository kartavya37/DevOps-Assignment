# Pod that uses the ConfigMap in two ways:
# 1. envFrom: every key becomes an environment variable.
# 2. volume: every key becomes a file in /etc/app-config.
apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo
  namespace: s12-config
  labels:
    app: config-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"Starting in $APP_ENV with log level $LOG_LEVEL\"; sleep 36000"]
      envFrom:
        - configMapRef:
            name: app-config
      env:
        # One key with a different variable name.
        - name: ENVIRONMENT_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_ENV
      volumeMounts:
        - name: config-volume
          mountPath: /etc/app-config
          readOnly: true
      resources:
        requests:
          cpu: "5m"
          memory: "8Mi"
        limits:
          cpu: "50m"
          memory: "32Mi"
  volumes:
    - name: config-volume
      configMap:
        name: app-config
