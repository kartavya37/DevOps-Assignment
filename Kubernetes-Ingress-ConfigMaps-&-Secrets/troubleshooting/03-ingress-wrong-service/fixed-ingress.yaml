# FIXED: the backend Service name is "shop". This matches the real Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-ingress
  namespace: s12-trouble
spec:
  ingressClassName: nginx
  rules:
    - host: shop.s12.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop
                port:
                  number: 80
