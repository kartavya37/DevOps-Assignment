# Pod that uses the Secret in two ways:
# 1. env with secretKeyRef: one environment variable for each key.
# 2. volume: each key becomes a read-only file in /etc/secrets.
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  namespace: s12-config
  labels:
    app: secret-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"Connecting to the database as $DB_USER\"; sleep 36000"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true
      resources:
        requests:
          cpu: "5m"
          memory: "8Mi"
        limits:
          cpu: "50m"
          memory: "32Mi"
  volumes:
    - name: secret-volume
      secret:
        secretName: db-credentials
        defaultMode: 0400
