# Secret with DUMMY demo values only. Never put real credentials in Git.
# The values in "data" are base64 encoded. Base64 is an encoding, not encryption.
#   printf '%s' admin               | base64  -> YWRtaW4=
#   printf '%s' demo-password-123   | base64  -> ZGVtby1wYXNzd29yZC0xMjM=
#   printf '%s' demo-api-key-abc123 | base64  -> ZGVtby1hcGkta2V5LWFiYzEyMw==
apiVersion: v1
kind: Secret # gitleaks:allow (dummy demo values)
metadata:
  name: db-credentials
  namespace: s12-config
  labels:
    app: secret-demo
type: Opaque
data:
  DB_USER: YWRtaW4= # gitleaks:allow (dummy demo value)
  DB_PASSWORD: ZGVtby1wYXNzd29yZC0xMjM= # gitleaks:allow (dummy demo value)
  API_KEY: ZGVtby1hcGkta2V5LWFiYzEyMw== # gitleaks:allow (dummy demo value)
